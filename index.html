<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My First 3D Web Page</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="menu-bar">
            <button class="menu-item" data-game="extractorv2" title="Extractor v2">
                <img src="image/Extractorv2.png" alt="Extractor v2">
            </button>
            <button class="menu-item" data-game="fatseal" title="Fat Seal">
                <img src="image/Fat_seal.png" alt="Fat Seal">
            </button>
            <button class="menu-item" data-game="sudoku" title="Sudoku">
                <img src="image/sudoku.png" alt="Sudoku">
            </button>
            <div class="social-links">
                <a href="#" class="social-icon" data-social="github_icon" title="GitHub" target="_blank">
                    <img src="image/github_icon.png" alt="GitHub">
                </a>
                <a href="#" class="social-icon" data-social="instagram_icon" title="Instagram" target="_blank">
                    <img src="image/instagram_logo.png" alt="Instagram">
                </a>
                <a href="#" class="social-icon" data-social="discord_icon" title="Discord" target="_blank">
                    <img src="image/discord_logo.jpg" alt="Discord">
                </a>
            </div>
        </div>

        <div id="container"></div>
        <button id="music-toggle" class="music-btn">
            <img id="music-icon" src="icon/music_on.png" alt="Toggle Music">
        </button>
        
        <!-- POPUP ELEMENT FOR CLICKABLE OBJECTS -->
        <div id="popup">
            <div id="popup-header">
                <h2 id="popup-title">Object Title</h2>
                <button id="popup-close">&times;</button>
            </div>
            <img id="popup-image" src="" alt="Object Image" style="display: none; max-width: 100%; max-height: 300px; margin-bottom: 10px; border-radius: 8px;">
            <p id="popup-description">                     </p>  <!-- Update depend on the object selected -->
            <a id="popup-link" href="#" target="_blank">Learn More</a>
        </div>
        
        <script type="module" src="main.js"></script>
    </body>
</html>
